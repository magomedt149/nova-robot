<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070910" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Motion Studio" />
  <title>TUMSOEV Motion + VFX Studio — FREE</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="eyebrow">TUMSOEV / FREE MOTION</div>
      <h1>Motion + VFX Studio</h1>
      <p class="lead">Motion, камера и локальные VFX прямо в браузере. Без кредитов.</p>

      <label>Опиши анимацию
        <textarea id="prompt" rows="3" placeholder="Например: TUMSOEV, кино, 5 секунд, камера orbit, дождь и искры"></textarea>
      </label>
      <button id="applyPrompt" class="secondary">Применить описание</button>

      <label>Главный текст<input id="title" value="TUMSOEV" maxlength="80"></label>
      <label>Подзаголовок<input id="subtitle" value="FREE MOTION STUDIO" maxlength="100"></label>

      <div class="grid2">
        <label>Длительность
          <select id="duration"><option>3</option><option selected>5</option><option>8</option><option>10</option><option>15</option></select>
        </label>
        <label>Формат
          <select id="ratio"><option selected>16:9</option><option>9:16</option></select>
        </label>
      </div>

      <div class="grid2">
        <label>Стиль
          <select id="style">
            <option value="neon" selected>Неон</option>
            <option value="gold">Кино / золото</option>
            <option value="clean">Чистый</option>
            <option value="redcyan">Красно-голубой 3D</option>
            <option value="hologram">Голограмма</option>
          </select>
        </label>
        <label>Движение
          <select id="motion">
            <option value="slide" selected>Слайд</option>
            <option value="rise">Подъём</option>
            <option value="float">Плавание</option>
            <option value="zoom">Приближение</option>
            <option value="pulse">Пульс</option>
          </select>
        </label>
      </div>

      <div class="grid2 vfx-grid">
        <label>Камера
          <select id="camera">
            <option value="static" selected>Статичная</option>
            <option value="push">Push-in</option>
            <option value="orbit">Orbit</option>
            <option value="handheld">Handheld</option>
          </select>
        </label>
        <label>VFX
          <select id="vfx">
            <option value="none" selected>Без эффекта</option>
            <option value="sparks">Искры</option>
            <option value="smoke">Дым</option>
            <option value="fog">Туман</option>
            <option value="rain">Дождь</option>
            <option value="lightning">Молния</option>
            <option value="debris">Обломки</option>
            <option value="fire">Огонь</option>
            <option value="explosion">Взрыв</option>
          </select>
        </label>
      </div>

      <label>Сила VFX
        <select id="intensity">
          <option value="0.35">Лёгкая</option>
          <option value="0.65" selected>Средняя</option>
          <option value="1">Сильная</option>
        </select>
      </label>

      <div class="actions">
        <button id="preview" class="secondary">▶ Предпросмотр</button>
        <button id="render">Сгенерировать видео</button>
      </div>
      <div id="status" class="status">Готово. Генерация выполняется на твоём устройстве.</div>
      <a id="download" class="download hidden" download>Скачать видео</a>
    </section>

    <section class="stageWrap">
      <div class="canvasShell">
        <canvas id="canvas" width="1280" height="720"></canvas>
      </div>
      <div class="badges"><span>NO API KEY</span><span>NO CREDITS</span><span>LOCAL VFX</span><span>30 FPS</span></div>
      <video id="video" controls playsinline class="video hidden"></video>
    </section>
  </main>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
