name: NOVA Irina TTS

on:
  pull_request:
    paths:
      - ".nova/irina_job.txt"

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Piper
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz

      - name: Download NOVA Irina voice
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o ru_RU-irina-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl -L --fail --retry 3 \
            -o ru_RU-irina-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json
          echo "8ff38212d23da300bbe3705c645e6e5b9475f0bfde01558eb17813e22acaaaaa  ru_RU-irina-medium.onnx" | sha256sum -c -

      - name: Synthesize exact Irina
        shell: bash
        run: |
          set -euo pipefail
          test -s .nova/irina_job.txt
          ./piper/piper \
            --model ru_RU-irina-medium.onnx \
            --config ru_RU-irina-medium.onnx.json \
            --output_file irina.wav \
            < .nova/irina_job.txt
          test -s irina.wav

      - name: Upload Irina audio
        uses: actions/upload-artifact@v4
        with:
          name: nova-irina-tts
          path: irina.wav
          if-no-files-found: error
