name: NOVA Video PRO v31 checks


on:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and invariants
        run: |
          set -euo pipefail
          node --check nova-video-pro.js
          node --check hollywood-studio.js
          node <<'NODE'
          const fs=require('fs');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('PASS',msg)};
          const pro=fs.readFileSync('nova-video-pro.js','utf8');
          const loader=fs.readFileSync('hollywood-studio.js','utf8');
          must(loader.includes('nova-video-pro.js?v=31.0.0'),'v31 loader');
          for(const id of ['novaProTab','novaProPrompt','novaProNegative','novaProImageRef','novaProVideoRef','novaProExtend','novaProPlayer','novaProSeek','novaProRenderTimeline']) must(pro.includes(id),id);
          must(pro.includes('renderFiveLegacy')&&pro.includes('nova-short-prompt'),'Multi Shorts prompt/reference renderer');
          must(pro.includes('novaMotionPrompt')&&pro.includes('novaMotionExtendPro'),'Motion prompt and Extend');
          must(pro.includes('NovaMediaLibrary.registerBlob'),'auto save to library');
          must(pro.includes("data-a=\"stop\"")&&pro.includes("data-pro-player=\"stop\""),'Play Pause Stop controls');
          must(pro.includes('deleteOldLibrary')&&pro.includes('clearTemporary'),'storage cleanup tools');
          must(!/^<<<<<<<|^=======|^>>>>>>>/m.test(pro),'no conflict markers');
          NODE
      - name: No production deployment
        run: echo 'Branch-only checks. No Netlify deployment.'

  chromium:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Video PRO UI and local renderer smoke
        run: |
          set -euo pipefail
          python3 -m http.server 4181 --bind 127.0.0.1 >/tmp/nova-v31.log 2>&1 &
          PID=$!; trap 'kill $PID || true; rm -f nova-v31.mjs' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4181/ >/dev/null 2>&1 && break; sleep .2; done
          cat > nova-v31.mjs <<'NODE'
          import { chromium } from 'playwright';
          const must=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('PASS',msg)};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          const r=await page.goto('http://127.0.0.1:4181/',{waitUntil:'domcontentloaded'});must(r?.ok(),'NOVA loads');
          await page.waitForSelector('#novaMediaLaunch',{timeout:20000});await page.click('#novaMediaLaunch');
          await page.waitForSelector('#novaProTab',{timeout:15000});
          await page.click('#novaProTab');await page.waitForSelector('#novaProPane:not([hidden])');
          for(const id of ['#novaProPrompt','#novaProNegative','#novaProImageRef','#novaProVideoRef','#novaProRefMode','#novaProExtend','#novaProPlayer','#novaProSeek']) must(await page.locator(id).count()===1,id);
          must(await page.locator('#novaProScenes .nova-pro-scene').count()===5,'five editor scenes');
          for(const action of ['play','pause','stop','back','forward']) must(await page.locator(`[data-pro-player="${action}"]`).count()===1,`player ${action}`);
          await page.click('#novaMultiShortsTab');await page.waitForSelector('[data-media-pane="shorts"]:not([hidden])');
          must(await page.locator('#novaShortMasterPrompt').count()===1,'Multi Shorts master prompt');
          must(await page.locator('#novaShortImageRef').count()===1&&await page.locator('#novaShortVideoRef').count()===1,'Multi Shorts references');
          must(await page.locator('.nova-short-prompt').count()===5,'five scene prompts');
          await page.click('#novaMotionTab');await page.waitForSelector('[data-media-pane="motion"]:not([hidden])');
          must(await page.locator('#novaMotionPrompt').count()===1&&await page.locator('#novaMotionExtendPro').count()===1,'Motion prompt and Extend');
          must(await page.locator('[data-for="novaMotionPreviewVideo"] [data-a="stop"]').count()===1||await page.locator('[data-for="motion"] [data-a="stop"]').count()===1,'Motion Stop control');
          const caps=await page.evaluate(()=>({v:window.NovaVideoPro?.version,media:typeof MediaRecorder!=='undefined',capture:typeof HTMLCanvasElement.prototype.captureStream==='function'}));
          must(caps.v==='31.0.0'&&caps.media&&caps.capture,'v31 local video capabilities');
          const relevant=errors.filter(v=>!/service worker|favicon/i.test(v));must(relevant.length===0,`no page errors ${relevant.join(' | ')}`);
          await browser.close();
          NODE
          node nova-v31.mjs

  iphone-webkit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null
      - name: iPhone WebKit controls and storage smoke
        run: |
          set -euo pipefail
          python3 -m http.server 4182 --bind 127.0.0.1 >/tmp/nova-v31-ios.log 2>&1 &
          PID=$!; trap 'kill $PID || true; rm -f nova-v31-ios.mjs' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4182/ >/dev/null 2>&1 && break; sleep .2; done
          cat > nova-v31-ios.mjs <<'NODE'
          import { webkit } from 'playwright';
          const must=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('PASS',msg)};
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1'});
          const page=await ctx.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const r=await page.goto('http://127.0.0.1:4182/',{waitUntil:'domcontentloaded'});must(r?.ok(),'iPhone NOVA loads');
          await page.waitForSelector('#novaMediaLaunch',{timeout:20000});await page.click('#novaMediaLaunch');await page.waitForSelector('#novaProTab',{timeout:15000});await page.click('#novaProTab');
          must(await page.locator('#novaProPlayerBar button').count()===5,'iPhone custom player has five controls');
          must(await page.locator('[data-pro-player="stop"]').count()===1,'iPhone Stop control');
          must(await page.locator('#novaProClearTemp').count()===1&&await page.locator('#novaProDeleteOld').count()===1,'iPhone cleanup controls');
          must(await page.locator('#novaProLibrarySelect').count()===1,'library reference picker');
          await page.click('#novaMultiShortsTab');must(await page.locator('#novaShortRefMode').count()===1,'Shorts exact/style reference mode');
          const relevant=errors.filter(v=>!/service worker|favicon/i.test(v));must(relevant.length===0,`no WebKit errors ${relevant.join(' | ')}`);
          await browser.close();
          NODE
          node nova-v31-ios.mjs
      - name: No production deploy
        run: echo 'WebKit test is local only.'
