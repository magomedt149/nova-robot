name: Piper Irina 5s sample

on:
  push:
    branches: [piper-irina-sample-5s]
    paths:
      - '.github/workflows/piper-irina-sample.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: piper-irina-sample-5s

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Piper
        run: python -m pip install --quiet piper-tts

      - name: Download Russian Irina voice
        run: python -m piper.download_voices ru_RU-irina-medium

      - name: Synthesize exact five-second WAV
        run: |
          python -m piper -m ru_RU-irina-medium -f raw.wav -- 'Вечером, когда всё стихло, город зажёг свои огни.'
          python - <<'PY'
          import wave
          src='raw.wav'
          dst='nova_piper_irina_5s.wav'
          with wave.open(src,'rb') as r:
              params=r.getparams()
              frames=r.readframes(r.getnframes())
          frame_bytes=params.sampwidth*params.nchannels
          target_frames=int(params.framerate*5)
          target_bytes=target_frames*frame_bytes
          if len(frames) < target_bytes:
              frames += b'\x00'*(target_bytes-len(frames))
          else:
              frames = frames[:target_bytes]
          with wave.open(dst,'wb') as w:
              w.setnchannels(params.nchannels)
              w.setsampwidth(params.sampwidth)
              w.setframerate(params.framerate)
              w.writeframes(frames)
          with wave.open(dst,'rb') as r:
              print('DURATION=', r.getnframes()/r.getframerate())
          PY
          base64 -w0 nova_piper_irina_5s.wav > nova_piper_irina_5s.b64

      - name: Commit base64 sample
        run: |
          git config user.name 'NOVA Piper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nova_piper_irina_5s.b64
          git commit -m 'Add generated Piper Irina 5s sample'
          git push origin HEAD:piper-irina-sample-5s
