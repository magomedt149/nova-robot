name: Piper Irina 5s sample

on:
  push:
    branches: [piper-irina-sample-5s]
    paths:
      - '.github/workflows/piper-irina-sample.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: piper-irina-sample-5s

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Piper
        run: python -m pip install --quiet piper-tts

      - name: Download Russian Irina voice
        run: python -m piper.download_voices ru_RU-irina-medium

      - name: Synthesize and fit to five seconds
        run: |
          python -m piper -m ru_RU-irina-medium -f raw.wav -- 'Вечером, когда всё стихло, город зажёг свои огни.'
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 raw.wav)
          TEMPO=$(python -c "print(max(0.5,min(2.0,float('$DUR')/5.0)))")
          ffmpeg -y -i raw.wav -filter:a "atempo=${TEMPO},apad=pad_dur=5" -t 5 -ar 22050 -ac 1 -c:a libmp3lame -b:a 128k nova_piper_irina_5s.mp3 >/dev/null 2>&1
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 nova_piper_irina_5s.mp3
          base64 -w0 nova_piper_irina_5s.mp3 > nova_piper_irina_5s.b64

      - name: Commit base64 sample
        run: |
          git config user.name 'NOVA Piper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nova_piper_irina_5s.b64
          git commit -m 'Add generated Piper Irina 5s sample'
          git push origin HEAD:piper-irina-sample-5s
