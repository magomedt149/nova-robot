name: Piper Russian male voice comparison

on:
  push:
    branches: [piper-irina-sample-5s]
    paths:
      - '.github/workflows/piper-irina-sample.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: piper-irina-sample-5s

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Piper
        run: python -m pip install --quiet piper-tts

      - name: Download Russian male voices
        run: python -m piper.download_voices ru_RU-denis-medium ru_RU-dmitri-medium ru_RU-ruslan-medium

      - name: Synthesize same male line
        run: |
          python -m piper -m ru_RU-denis-medium -f Denis.wav -- 'Да, Ирина, уже еду.'
          python -m piper -m ru_RU-dmitri-medium -f Dmitri.wav -- 'Да, Ирина, уже еду.'
          python -m piper -m ru_RU-ruslan-medium -f Ruslan.wav -- 'Да, Ирина, уже еду.'

      - uses: actions/upload-artifact@v4
        with:
          name: nova-russian-male-voices
          path: |
            Denis.wav
            Dmitri.wav
            Ruslan.wav
          retention-days: 1
