name: Netlify Free Diagnostics

on:
  push:
    branches: [netlify-free-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Netlify public deploy state
        shell: bash
        run: |
          set -u
          SITE_ID="ae7fa0fb-e73d-413a-b122-7b9ff9419244"
          BASE="https://api.netlify.com/api/v1"

          echo "=== SITE ==="
          curl -sS --max-time 20 "$BASE/sites/$SITE_ID" | jq . || true

          echo "=== RECENT DEPLOYS ==="
          curl -sS --max-time 20 "$BASE/sites/$SITE_ID/deploys?per_page=8" > /tmp/deploys.json
          jq -c '.[] | {id,build_id,state,skipped,error_message,branch,context,commit_ref,title,created_at,published_at}' /tmp/deploys.json || true

          DEPLOY_ID="$(jq -r '.[0].id // empty' /tmp/deploys.json)"
          BUILD_ID="$(jq -r '.[0].build_id // empty' /tmp/deploys.json)"

          echo "=== LATEST DEPLOY DETAIL ==="
          if [ -n "$DEPLOY_ID" ]; then
            curl -sS --max-time 20 "$BASE/deploys/$DEPLOY_ID" | jq . || true
          fi

          echo "=== LATEST BUILD DETAIL ==="
          if [ -n "$BUILD_ID" ]; then
            curl -sS --max-time 20 "$BASE/builds/$BUILD_ID" | jq . || true
          fi

          echo "=== DEPLOY COUNTS ==="
          curl -sS --max-time 20 "$BASE/sites/$SITE_ID/deploys?per_page=100" > /tmp/deploys100.json
          echo -n "READY_PRODUCTION_LAST_100="
          jq '[.[] | select(.context=="production" and .state=="ready")] | length' /tmp/deploys100.json
          echo -n "SKIPPED_PRODUCTION_LAST_100="
          jq '[.[] | select(.context=="production" and .skipped==true)] | length' /tmp/deploys100.json
          echo "READY_PRODUCTION_TIMES="
          jq -r '.[] | select(.context=="production" and .state=="ready") | [.created_at,.commit_ref,.title] | @tsv' /tmp/deploys100.json | head -30

          echo "=== LIVE VERSION ==="
          curl -sS -w "\nHTTP=%{http_code}\n" --max-time 20 "https://dashing-otter-990b47.netlify.app/version.json?t=$(date +%s)" | head -80

      - name: Check Netlify token without exposing it
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_TOKEN_PRESENT=true"
          else
            echo "NETLIFY_TOKEN_PRESENT=false"
          fi

      - name: Create zero-production-credit preview
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ae7fa0fb-e73d-413a-b122-7b9ff9419244
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "Skipping preview: NETLIFY_AUTH_TOKEN is not configured."
            exit 0
          fi
          npx --yes netlify-cli@latest deploy             --dir=.             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --json > /tmp/netlify-preview.json
          jq '{deploy_id, deploy_url, url, logs}' /tmp/netlify-preview.json
