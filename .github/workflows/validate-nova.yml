name: Validate NOVA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "motion-studio/**"
      - "automation/remote_gpu_worker.py"
      - "automation/nova_music.py"
      - "blender-colab/NOVA_Remote_GPU_Worker.ipynb"
      - "version.json"
      - ".github/workflows/validate-nova.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: |
          python -m py_compile             automation/remote_gpu_worker.py             automation/nova_pipeline.py             automation/nova_music.py             blender-colab/scripts/extract_pose.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check motion-studio/app.js
          node --check motion-studio/director.js
          node --check motion-studio/remote-gpu.js
          node --check service-worker.js
          node --check motion-studio/service-worker.js
      - name: Notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("blender-colab/NOVA_Remote_GPU_Worker.ipynb")
          data=json.loads(path.read_text(encoding="utf-8"))
          assert data.get("nbformat") == 4
          assert data.get("cells")
          print("Notebook OK:", len(data["cells"]), "cells")
          PY
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: FFmpeg audio replacement smoke test
        run: |
          set -e
          ffmpeg -version | head -1
          mkdir -p /tmp/nova-media-test
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=black:s=320x240:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/nova-media-test/source.mp4
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880:sample_rate=44100 -t 1 -c:a pcm_s16le /tmp/nova-media-test/new.wav
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i sine=frequency=1320:sample_rate=44100 -t 1.3 -c:a pcm_s16le /tmp/nova-media-test/second.wav
          ffmpeg -y -hide_banner -loglevel error -i /tmp/nova-media-test/source.mp4 -i /tmp/nova-media-test/new.wav -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -af apad -shortest -movflags +faststart /tmp/nova-media-test/out.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/out.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/out.mp4)" = "aac"
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/nova-media-test/source.mp4 -i /tmp/nova-media-test/new.wav -i /tmp/nova-media-test/second.wav             -filter_complex "[0:a]volume=0.8,apad[a0];[1:a]volume=0.35,apad[a1];[2:a]volume=0.2,apad[a2];[a0][a1][a2]amix=inputs=3:duration=longest:dropout_transition=0,volume=1[mix]"             -map 0:v:0 -map "[mix]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart /tmp/nova-media-test/mix.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/mix.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/mix.mp4)" = "aac"
          grep -q "replace_audio" automation/remote_gpu_worker.py
          grep -q "mix_audio" automation/remote_gpu_worker.py
          grep -q "export_mp4_compatible" automation/remote_gpu_worker.py
          grep -q "run_worker_self_test" automation/remote_gpu_worker.py
          grep -q "PROTOCOL_VERSION = 8" automation/remote_gpu_worker.py
          for instrument in guitar piano accordion bass synth; do
            python automation/nova_music.py --chords "Am,D,G,Em" --bpm 120 --instrument "$instrument" --beats-per-chord 0.5 --repeats 1 --out "/tmp/nova-media-test/music-$instrument.wav"
            test -s "/tmp/nova-media-test/music-$instrument.wav"
          done
          cp /tmp/nova-media-test/music-guitar.wav /tmp/nova-media-test/chords.wav
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/chords.wav)" = "pcm_s16le"
          ffmpeg -y -hide_banner -loglevel error -i /tmp/nova-media-test/chords.wav -c:a libmp3lame -b:a 128k /tmp/nova-media-test/chords.mp3
          test -s /tmp/nova-media-test/chords.mp3
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/chords.mp3)" = "mp3"
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/nova-media-test/source.mp4 -i /tmp/nova-media-test/chords.wav             -filter_complex "[0:a]volume=0.8,apad[a0];[1:a]volume=0.35,afade=t=in:st=0:d=0.25,afade=t=out:st=0.75:d=0.25,apad[a1];[a0][a1]amix=inputs=2:duration=longest:dropout_transition=0[mix]"             -map 0:v:0 -map "[mix]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart /tmp/nova-media-test/chord-video.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/chord-video.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/nova-media-test/chord-video.mp4)" = "aac"
          grep -q "audio_tracks" automation/remote_gpu_worker.py
          grep -q "run_music_job" automation/remote_gpu_worker.py
          grep -q "music_chords" automation/remote_gpu_worker.py
          grep -q "remoteAudio" motion-studio/remote-gpu.js
          grep -q "track_volumes" motion-studio/remote-gpu.js
          grep -q "track_fade_in" automation/remote_gpu_worker.py
          grep -q "track_fade_out" automation/remote_gpu_worker.py
          grep -q "audioFadeConfig" motion-studio/remote-gpu.js
          grep -q "userApprovedRemote" motion-studio/remote-gpu.js
          grep -q "remoteSelfTest" motion-studio/remote-gpu.js
          grep -q "смеш.*дорож" app.js
          grep -q "v29-music-fades" motion-studio/service-worker.js
          echo "OK: NOVA chord music + fade-in/fade-out + WAV/MP3 + video mix + multi-track audio"
