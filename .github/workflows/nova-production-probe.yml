name: NOVA production probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-production-probe.yml'

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[nova-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show latest Netlify deploy records
        env:
          SITE_ID: ae7fa0fb-e73d-413a-b122-7b9ff9419244
        run: |
          curl -sS --max-time 20 "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=8" > /tmp/deploys.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/deploys.json','utf8'));
          for (const d of rows) console.log(JSON.stringify({id:d.id,created_at:d.created_at,state:d.state,skipped:d.skipped,commit_ref:d.commit_ref,title:d.title,error_message:d.error_message,summary:d.summary}));
          NODE
