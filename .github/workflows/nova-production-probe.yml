name: NOVA production probe

on:
  workflow_dispatch:
    inputs:
      nova_url:
        description: 'Published NOVA URL'
        required: true
        type: string
        default: 'https://dashing-otter-990b47.netlify.app/'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check published NOVA pages without generation
        env:
          NOVA_URL: ${{ inputs.nova_url }}
        run: |
          set -euo pipefail
          BASE="${NOVA_URL%/}"
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/" --output /tmp/nova-home.html
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/studio/" --output /tmp/nova-studio.html
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/videogpt/" --output /tmp/nova-videogpt.html
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/service-worker.js" --output /tmp/nova-service-worker.js
          grep -q 'NOVA 33' /tmp/nova-home.html
          grep -q 'VideoGPT Prompt' /tmp/nova-studio.html
          grep -q 'Без автоматических списаний' /tmp/nova-videogpt.html
          grep -q 'nova-v33' /tmp/nova-service-worker.js
          echo 'NOVA production pages are online. No video or paid API was started.'
