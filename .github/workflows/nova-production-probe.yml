name: NOVA production probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-production-probe.yml'

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[nova-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public Netlify deploy and build state
        env:
          SITE_ID: ae7fa0fb-e73d-413a-b122-7b9ff9419244
        run: |
          set +e
          echo '=== SITE ==='
          curl -sS --max-time 15 -w '\nHTTP=%{http_code}\n' "https://api.netlify.com/api/v1/sites/$SITE_ID" | head -c 8000
          echo
          echo '=== DEPLOYS ==='
          curl -sS --max-time 15 -w '\nHTTP=%{http_code}\n' "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=20" | head -c 20000
          echo
          echo '=== BUILDS ==='
          curl -sS --max-time 15 -w '\nHTTP=%{http_code}\n' "https://api.netlify.com/api/v1/sites/$SITE_ID/builds?per_page=20" | head -c 20000
          echo
          echo '=== BUILD TRIGGER TEST (no auth, expected 401 if protected) ==='
          curl -sS --max-time 15 -X POST -H 'Content-Type: application/json' -d '{}' -w '\nHTTP=%{http_code}\n' "https://api.netlify.com/api/v1/sites/$SITE_ID/builds" | head -c 4000
          echo
