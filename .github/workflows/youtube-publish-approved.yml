name: Publish Approved YouTube Short

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'youtube_queue/publish_approved.json'
      - '.github/workflows/youtube-publish-approved.yml'

permissions:
  contents: write

concurrency:
  group: youtube-approved-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: youtube/requirements-publish.txt

      - name: Resolve the exact queue selected for approval
        id: queue
        run: |
          set -euo pipefail
          target_date="$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          approval = json.loads(Path('youtube_queue/publish_approved.json').read_text(encoding='utf-8'))
          print(str(approval.get('date') or datetime.now(ZoneInfo('America/Los_Angeles')).date().isoformat()))
          PY
          )"
          python youtube/prepare_daily_queue.py \
            --date "$target_date" \
            --output youtube_output/prepared_queue.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Check explicit approval and duplicate guard
        id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          queue = json.loads(Path('youtube_output/prepared_queue.json').read_text(encoding='utf-8'))
          approval = json.loads(Path('youtube_queue/publish_approved.json').read_text(encoding='utf-8'))
          last_path = Path('youtube_queue/last_uploaded.json')
          last = json.loads(last_path.read_text(encoding='utf-8')) if last_path.exists() else {}

          queue_date = str(queue.get('date', ''))
          queue_content_id = str(queue.get('content_id', ''))
          approved_content_id = str(approval.get('content_id', '')).strip()
          content_matches = bool(approved_content_id) and approved_content_id == queue_content_id
          approved = (
              approval.get('approved') is True
              and str(approval.get('date', '')) == queue_date
              and content_matches
          )
          fingerprint_match = bool(queue.get('content_fingerprint')) and (
              str(last.get('content_fingerprint', '')) == str(queue.get('content_fingerprint', ''))
          )
          legacy_title_match = (
              not last.get('content_fingerprint')
              and bool(last.get('title'))
              and str(last.get('title')) == str(queue.get('title'))
          )
          duplicate = fingerprint_match or legacy_title_match
          publish = approved and not duplicate
          privacy = str(approval.get('privacy_status', 'public')).lower()
          if privacy not in {'private', 'unlisted', 'public'}:
              privacy = 'public'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('publish=' + str(publish).lower() + '\n')
              handle.write('approved=' + str(approved).lower() + '\n')
              handle.write('duplicate=' + str(duplicate).lower() + '\n')
              handle.write('privacy=' + privacy + '\n')
              handle.write('queue_date=' + queue_date + '\n')
              handle.write('content_id=' + queue_content_id + '\n')

          print('approved:', approved, 'duplicate:', duplicate, 'publish:', publish)
          if approval.get('approved') is True and not content_matches:
              print('Approval content_id does not match the prepared preview.')
          PY

      - name: Stop safely when there is no fresh approval
        if: ${{ steps.gate.outputs.publish != 'true' }}
        run: echo 'No fresh explicit owner approval. Nothing was uploaded.'

      - name: Install free rendering and YouTube tools
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          packages=()
          command -v ffmpeg >/dev/null 2>&1 || packages+=(ffmpeg)
          [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]] || packages+=(fonts-dejavu-core)
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          python -m pip install --requirement youtube/requirements-publish.txt

      - name: Verify YouTube OAuth secrets exist
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          test -n "$YOUTUBE_CLIENT_ID" || (echo 'Missing YOUTUBE_CLIENT_ID' && exit 1)
          test -n "$YOUTUBE_CLIENT_SECRET" || (echo 'Missing YOUTUBE_CLIENT_SECRET' && exit 1)
          test -n "$YOUTUBE_REFRESH_TOKEN" || (echo 'Missing YOUTUBE_REFRESH_TOKEN' && exit 1)

      - name: Download selected Piper voice
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python -m piper.download_voices "${{ steps.queue.outputs.voice_id }}"

      - name: Re-render the approved Short deterministically
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: >-
          python youtube/render_short.py
          --queue youtube_output/prepared_queue.json
          --output-dir youtube_output

      - name: Validate the final upload package
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python youtube/validate_short.py --output-dir youtube_output

      - name: Upload approved Short to YouTube
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ steps.gate.outputs.privacy }}
        run: python youtube/upload_youtube.py

      - name: Record upload and reset approval
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('youtube_output/youtube_upload_result.json').read_text(encoding='utf-8'))
          Path('youtube_queue/last_uploaded.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          approval_path = Path('youtube_queue/publish_approved.json')
          approval = json.loads(approval_path.read_text(encoding='utf-8'))
          approval['approved'] = False
          approval['date'] = ''
          approval['content_id'] = ''
          approval['note'] = 'Reset automatically after successful upload. Approve only after watching the exact preview.'
          approval_path.write_text(
              json.dumps(approval, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'nova-youtube-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add youtube_queue/last_uploaded.json youtube_queue/publish_approved.json
          git diff --cached --quiet || git commit -m 'Record approved YouTube upload and reset approval'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save published package
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: published-youtube-short-${{ steps.gate.outputs.queue_date }}
          path: |
            youtube_output/short.mp4
            youtube_output/thumbnail.jpg
            youtube_output/metadata.json
            youtube_output/validation_report.json
            youtube_output/youtube_upload_result.json
          if-no-files-found: error
          retention-days: 2

      - name: Save failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-diagnostics-${{ github.run_id }}
          path: youtube_output/
          if-no-files-found: ignore
          retention-days: 2

      - name: Write clear publish summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          APPROVED: ${{ steps.gate.outputs.approved }}
          DUPLICATE: ${{ steps.gate.outputs.duplicate }}
          CONTENT_ID: ${{ steps.gate.outputs.content_id }}
        run: |
          {
            echo '## NOVA YouTube publish gate'
            echo "- Status: ${JOB_STATUS}"
            echo "- Explicit approval matched: ${APPROVED:-false}"
            echo "- Duplicate blocked: ${DUPLICATE:-false}"
            echo "- Content: ${CONTENT_ID:-not resolved}"
          } >> "$GITHUB_STEP_SUMMARY"
