name: NOVA one-shot version sync 27.31.1

on:
  push:
    branches:
      - fix/nova-pwa-whisper-truth-27.31.1
    paths:
      - .github/workflows/nova-temp-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: fix/nova-pwa-whisper-truth-27.31.1

      - name: Sync only NOVA release markers
        shell: python
        run: |
          from pathlib import Path
          import json

          # index.html: only release/cache markers that currently say 27.31.0.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('./styles.css?v=27.31.0', './styles.css?v=27.31.1')
          s = s.replace('NOVA 27.31.0 — MCP BRIDGE', 'NOVA 27.31.1 — MCP BRIDGE')
          s = s.replace('<span class="version">v27.31.0</span>', '<span class="version">v27.31.1</span>')
          if s == before:
              raise SystemExit('index.html: expected 27.31.0 markers not found')
          p.write_text(s, encoding='utf-8')

          # version.json: canonical app + PWA release only.
          p = Path('version.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('version') != '27.31.0' or data.get('pwa') != '27.31.0':
              raise SystemExit(f"version.json unexpected version/pwa: {data.get('version')}/{data.get('pwa')}")
          data['version'] = '27.31.1'
          data['pwa'] = '27.31.1'
          if data.get('healthRuntimeVersion') == '27.31.0':
              data['healthRuntimeVersion'] = '27.31.1'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # service worker cache release marker.
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          old = "const APP_VERSION = '27.31.0';"
          new = "const APP_VERSION = '27.31.1';"
          if old not in s:
              raise SystemExit('service-worker.js expected APP_VERSION not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # manifest was already safely moved to 27.31.1; validate it.
          m = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          if '27.31.1' not in m.get('name','') or m.get('short_name') != 'NOVA 27.31.1' or m.get('start_url') != './?pwa=27.31.1':
              raise SystemExit('manifest.webmanifest is not fully synchronized')

      - name: Free static checks
        shell: python
        run: |
          from pathlib import Path
          import json, re

          idx = Path('index.html').read_text(encoding='utf-8')
          ver = json.loads(Path('version.json').read_text(encoding='utf-8'))
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          man = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))

          assert 'NOVA 27.31.1 — MCP BRIDGE' in idx
          assert '<span class="version">v27.31.1</span>' in idx
          assert './styles.css?v=27.31.1' in idx
          assert ver['version'] == '27.31.1'
          assert ver['pwa'] == '27.31.1'
          assert ver.get('healthRuntimeVersion') == '27.31.1'
          assert re.search(r"const APP_VERSION = ['\"]27\.31\.1['\"]", sw)
          assert man['short_name'] == 'NOVA 27.31.1'
          assert man['start_url'] == './?pwa=27.31.1'
          print('PASS: index/version/service-worker/manifest = 27.31.1')

      - name: Remove temporary workflow and commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nova-temp-version-sync.yml
          git config user.name "NOVA Free Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json service-worker.js manifest.webmanifest .github/workflows/nova-temp-version-sync.yml
          git diff --cached --check
          git diff --cached --exit-code --quiet && exit 0
          git commit -m "Sync NOVA release markers to 27.31.1 [skip ci]"
          git push origin HEAD:fix/nova-pwa-whisper-truth-27.31.1
