name: NOVA source backup

on:
  pull_request:
    paths:
      - '.nova-backup-request'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          mkdir -p backup_meta
          printf '%s\n' "$SHA" > backup_meta/COMMIT_SHA.txt
          printf '%s\n' "main" > backup_meta/BRANCH.txt
          git ls-files > backup_meta/TRACKED_FILES.txt
          cat > backup_meta/README_RESTORE.txt <<'EOF'
          NOVA source backup
          Repository: magomedt149/nova-robot
          This archive is a clean snapshot of the tracked source tree.
          It does not include GitHub Actions secrets, local .env files, or other untracked files.
          Restore by unzipping NOVA_SOURCE_SNAPSHOT.zip into a new folder.
          EOF
          git archive --format=zip --output=NOVA_SOURCE_SNAPSHOT.zip HEAD
          sha256sum NOVA_SOURCE_SNAPSHOT.zip > backup_meta/SHA256SUMS.txt

      - name: Upload NOVA backup
        uses: actions/upload-artifact@v4
        with:
          name: NOVA_SOURCE_BACKUP
          path: |
            NOVA_SOURCE_SNAPSHOT.zip
            backup_meta/
          retention-days: 30
          if-no-files-found: error
