name: NOVA one-shot Whisper wording cleanup

on:
  push:
    branches:
      - fix/nova-pwa-whisper-truth-27.31.1
    paths:
      - .github/workflows/nova-temp-whisper-wording.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: fix/nova-pwa-whisper-truth-27.31.1

      - name: Replace misleading diarization wording
        shell: python
        run: |
          from pathlib import Path

          p = Path('nova-whisper.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '🗣️ MP4 без SRT — локальный Whisper + авто-спикеры': '🗣️ MP4 без SRT — локальный Whisper + эвристическая оценка голоса',
            'Видео не отправляется на сервер. NOVA извлекает аудио, распознаёт до 2 минут, локально оценивает мужской/женский голос, назначает Дениса/Ирину и сохраняет исходные тайминги субтитров без сдвига.': 'Видео не отправляется на сервер. NOVA извлекает аудио, распознаёт до 2 минут и приблизительно распределяет реплики между Денисом/Ириной по высоте голоса. Это эвристика, а не точное распознавание личности говорящего. Исходные тайминги субтитров сохраняются без сдвига.',
            'Whisper + спикеры: MP4 → RU MP3 + EN SRT': 'Whisper + оценка голоса: MP4 → RU MP3 + EN SRT',
            'function diarizeByGender(segments, pcm)': 'function assignVoicesByPitchHeuristic(segments, pcm)',
            'Определяю говорящих локально по голосу…': 'Приблизительно распределяю реплики по высоте голоса…',
            'const diarized = diarizeByGender(original, pcm);': 'const voiceEstimated = assignVoicesByPitchHeuristic(original, pcm);',
            'assertTimingsPreserved(original, diarized);': 'assertTimingsPreserved(original, voiceEstimated);',
            "const maleCount = diarized.filter((s) => s.voice === 'denis').length;": "const maleCount = voiceEstimated.filter((s) => s.voice === 'denis').length;",
            "const femaleCount = diarized.filter((s) => s.voice === 'irina').length;": "const femaleCount = voiceEstimated.filter((s) => s.voice === 'irina').length;",
            'Спикеры готовы: мужских сегментов ${maleCount}, женских ${femaleCount}. Тайминги сохранены без изменений.': 'Эвристическая оценка готова: реплик с низкой высотой голоса ${maleCount}, с высокой ${femaleCount}. Это приблизительное распределение, не идентификация говорящих. Тайминги сохранены без изменений.',
            "const russian = source === 'ru' ? diarized.map((s) => ({ ...s })) : await translateSegments(diarized, source, 'ru');": "const russian = source === 'ru' ? voiceEstimated.map((s) => ({ ...s })) : await translateSegments(voiceEstimated, source, 'ru');",
            "const english = source === 'en' ? diarized.map((s) => ({ ...s })) : await translateSegments(diarized, source, 'en');": "const english = source === 'en' ? voiceEstimated.map((s) => ({ ...s })) : await translateSegments(voiceEstimated, source, 'en');",
            "addDownload(mp3, `${base}_WHISPER_RU_AUTO_SPEAKERS.mp3`, '⬇ Русский MP3 · авто-спикеры');": "addDownload(mp3, `${base}_WHISPER_RU_VOICE_HEURISTIC.mp3`, '⬇ Русский MP3 · эвристическая оценка голоса');",
            '✅ Готово локально: Whisper ${model}, Денис/Ирина по голосу, русский MP3 + English SRT. Тайминги не изменены. Платных AI-кредитов нет.': '✅ Готово локально: Whisper ${model}, приблизительное распределение Денис/Ирина по высоте голоса, русский MP3 + English SRT. Это не точная идентификация говорящих. Тайминги не изменены. Платных AI-кредитов нет.',
            'return { file, model, sourceLanguage: source, original, diarized, russian, english, mp3, srt, rawSrt };': 'return { file, model, sourceLanguage: source, original, voiceEstimated, russian, english, mp3, srt, rawSrt };',
            'diarizeSegments(segments, pcm) {': 'estimateVoicesByPitch(segments, pcm) {',
            'const result = diarizeByGender(segments, pcm);': 'const result = assignVoicesByPitchHeuristic(segments, pcm);'
          }
          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit('Expected text not found:\n' + '\n'.join(missing))
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Verify honest wording and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check nova-whisper.js
          ! grep -niE 'diariz|diaris|диаризац|авто-спикер' nova-whisper.js
          grep -q 'эвристическая оценка голоса' nova-whisper.js
          grep -q 'не точная идентификация говорящих' nova-whisper.js
          grep -q 'assignVoicesByPitchHeuristic' nova-whisper.js
          echo 'PASS: Whisper wording is explicit heuristic, not diarization'

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nova-temp-whisper-wording.yml
          git config user.name "NOVA Free Sync"
          git config user.email "actions@users.noreply.github.com"
          git add nova-whisper.js .github/workflows/nova-temp-whisper-wording.yml
          git diff --cached --check
          git diff --cached --exit-code --quiet && exit 0
          git commit -m "Clarify Whisper speaker split is a pitch heuristic [skip ci]"
          git push origin HEAD:fix/nova-pwa-whisper-truth-27.31.1
