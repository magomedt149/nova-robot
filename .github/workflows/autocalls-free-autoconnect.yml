name: Autocalls FREE AutoConnect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autocalls-free-autoconnect.yml"
      - "automation/autocalls_free_autoconnect.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  free-autoconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTOCALLS_API_KEY: ${{ secrets.AUTOCALLS_API_KEY || secrets.AUTOCALLS_API_TOKEN || secrets.AUTOCALLS_TOKEN }}
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Discover assistant and run FREE test
        run: python3 automation/autocalls_free_autoconnect.py

      - name: Save non-secret status
        if: always()
        run: |
          if [ ! -f autocalls/FREE_CONNECT_STATUS.json ]; then
            mkdir -p autocalls
            printf '%s\n' '{"status":"WORKFLOW_ERROR","mode":"FREE_TEST_ONLY","paid_actions_enabled":false}' > autocalls/FREE_CONNECT_STATUS.json
          fi
          git config user.name "nova-autocalls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add autocalls/FREE_CONNECT_STATUS.json
          if git diff --cached --quiet; then
            echo "No status change."
          else
            git commit -m "Update Autocalls free connection status [skip ci]"
            git push
          fi
