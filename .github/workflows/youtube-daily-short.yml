name: Daily YouTube Short - FREE

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if queue date is not today'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/youtube-daily-short.yml'
      - 'youtube/**'
      - 'youtube_queue/**'

permissions:
  contents: write

concurrency:
  group: youtube-daily-short
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow piper-tts google-api-python-client google-auth google-auth-httplib2

      - name: Check queue date
        id: queue
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          data = json.load(open('youtube_queue/today.json', encoding='utf-8'))
          today = datetime.now(ZoneInfo('America/Los_Angeles')).date().isoformat()
          force = os.environ.get('FORCE', 'false').lower() == 'true'
          ok = (data.get('date') == today) or force
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + str(ok).lower() + '\n')
              f.write('queue_date=' + str(data.get('date', '')) + '\n')
          print('California today:', today, 'queue:', data.get('date'), 'ready:', ok)
          PY

      - name: Download locked Irina voice
        if: ${{ steps.queue.outputs.ready == 'true' }}
        run: python -m piper.download_voices ru_RU-irina-medium

      - name: Render 9x16 Short with exact Irina
        if: ${{ steps.queue.outputs.ready == 'true' }}
        run: python youtube/render_short.py

      - name: Check YouTube OAuth secrets
        if: ${{ steps.queue.outputs.ready == 'true' }}
        id: auth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'YouTube OAuth is not configured yet. Build artifact only; no upload.'
          fi

      - name: Upload to YouTube via official API
        if: ${{ steps.queue.outputs.ready == 'true' && steps.auth.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python youtube/upload_youtube.py

      - name: Save last uploaded marker
        if: ${{ steps.queue.outputs.ready == 'true' && steps.auth.outputs.ready == 'true' }}
        run: |
          cp youtube_output/youtube_upload_result.json youtube_queue/last_uploaded.json
          git config user.name 'nova-youtube-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add youtube_queue/last_uploaded.json
          git diff --cached --quiet || git commit -m 'Record daily YouTube upload'
          git push origin HEAD:main

      - name: Upload ready video package
        if: ${{ steps.queue.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-short
          path: |
            youtube_output/short.mp4
            youtube_output/thumbnail.jpg
            youtube_output/metadata.json
            youtube_output/youtube_upload_result.json
          if-no-files-found: warn
          retention-days: 2