name: Deploy NOVA to Netlify Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.txt"
      - "NOVA_DIAGNOSTICS_RU_2026-09-03.txt"
      - "NOVA_IPHONE_UPDATE_METHOD.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETLIFY_SITE_ID: ae7fa0fb-e73d-413a-b122-7b9ff9419244
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Netlify token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${NETLIFY_AUTH_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${NETLIFY_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${NETLIFY_API_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "NETLIFY_TOKEN_MISSING"
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          echo "NOVA_NETLIFY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy current main to production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NOVA_NETLIFY_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir . \
            --site "$NETLIFY_SITE_ID" \
            --message "NOVA v27.1 production update"

      - name: Verify production
        shell: bash
        run: |
          BASE="https://dashing-otter-990b47.netlify.app"
          for i in $(seq 1 20); do
            body="$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$BASE/version.json?t=$(date +%s)" 2>/dev/null || true)"
            echo "attempt=$i body=$body"
            if echo "$body" | grep -q '"version"[[:space:]]*:[[:space:]]*"27.1.0"'; then
              html="$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$BASE/?t=$(date +%s)")"
              echo "$html" | grep -q "v27.1"
              echo "$html" | grep -q "Motion + VFX"
              echo "PRODUCTION_NOVA=27.1.0"
              echo "PRODUCTION_MOTION_VFX=present"
              exit 0
            fi
            sleep 4
          done
          echo "Production did not reach NOVA 27.1.0." >&2
          exit 1
