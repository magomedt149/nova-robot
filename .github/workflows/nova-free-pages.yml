name: NOVA FREE — Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub's native Pages branch pipeline is the single deployment owner.
# This workflow validates NOVA only. Keeping deployment out of this workflow
# prevents duplicate Pages races and the red "in progress deployment" error.
concurrency:
  group: nova-free-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: FREE checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v5

      - name: Verify critical files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f nova-health.js
          test -f nova-auto-montage.js
          test -f nova-blender-camera.js
          test -f blender-agent/nova_blender_http_gateway.py
          test -f blender-colab/scripts/render_wolf_cat_scene.py
          test -f automation/validate_frontend.py
          test -f blender-colab/NOVA_Wolf_Auto_Worker.ipynb
          test -f blender-colab/scripts/render_wolf_cinema_auto.py
          echo "NOVA critical files: OK"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "JavaScript syntax: OK"

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/*.py \
            blender-colab/scripts/*.py \
            blender-agent/*.py \
            tests/*.py
          echo "Python syntax: OK"

      - name: Validate frontend structure
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/validate_frontend.py

      - name: Run dependency-free regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/run_static_tests.py

      - name: Diagnose Nova Super App 3D wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          render=Path('blender-colab/scripts/render_wolf_cat_scene.py').read_text(encoding='utf-8')
          ui=Path('nova-blender-camera.js').read_text(encoding='utf-8')
          gateway=Path('blender-agent/nova_blender_http_gateway.py').read_text(encoding='utf-8')
          assert 'NOVA_SUPER_APP_WOLF_CAT_V2' in render
          assert 'scene.render.engine="BLENDER_EEVEE"' in render
          assert 'BLENDER_WORKBENCH' not in render
          assert 'BLENDER_EEVEE_NEXT' not in render
          assert 'quadruped-v2' in render
          assert 'NovaBlenderAgent' in ui and 'nbaDiag' in ui and 'async function diagnose()' in ui
          for tool in ('scan_scene','preview_sequence','check_flow','check_loop','auto_refine','full_cycle'):
              assert tool in gateway
          print('Nova Super App 3D diagnostics: OK')
          PY

      - name: Validate dedicated FREE wolf notebook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('blender-colab/NOVA_Wolf_Auto_Worker.ipynb')
          text = p.read_text(encoding='utf-8')
          lower = text.lower()
          data = json.loads(text)

          assert data.get('nbformat') == 4
          assert data.get('cells')
          assert 'NOVA Wolf Direct Worker' in text
          assert 'runtime.unassign()' in text
          assert 'Blender 5.2.1' in text
          assert 'WanGP здесь не используются' in text
          assert 'pip install wangp' not in lower
          assert 'pip install wan2gp' not in lower
          print('FREE wolf notebook: OK')
          PY

      - name: Enforce FREE LOCK
        shell: bash
        run: |
          set -euo pipefail
          echo "No Netlify deploy, no paid API, no paid GPU job, and no duplicate Pages deploy is started by this workflow."
          echo "GitHub native Pages pipeline remains the single deployment owner."
