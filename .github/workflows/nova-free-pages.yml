name: NOVA FREE — Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# GitHub Pages for this repository is already deployed by GitHub's native
# Pages branch pipeline. A second actions/deploy-pages job races with that
# native deployment and causes red failures such as:
# "Deployment request failed ... due to in progress deployment".
#
# This workflow therefore owns validation only. The native Pages pipeline is
# the single deployment owner. This keeps NOVA FREE, avoids duplicate deploys,
# and makes every push deterministic.
concurrency:
  group: nova-free-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: FREE checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v5

      - name: Verify critical files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f nova-health.js
          test -f nova-auto-montage.js
          test -f automation/validate_frontend.py
          test -f blender-colab/NOVA_Wolf_Auto_Worker.ipynb
          test -f blender-colab/scripts/render_wolf_cinema_auto.py
          echo "NOVA critical files: OK"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "JavaScript syntax: OK"

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/*.py \
            blender-colab/scripts/*.py \
            tests/*.py
          echo "Python syntax: OK"

      - name: Validate frontend structure
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/validate_frontend.py

      - name: Run dependency-free regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/run_static_tests.py

      - name: Validate dedicated FREE wolf notebook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('blender-colab/NOVA_Wolf_Auto_Worker.ipynb')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('nbformat') == 4
          assert data.get('cells')
          text = p.read_text(encoding='utf-8')
          assert 'NOVA_WOLF_AUTO_V1' in text
          assert 'runtime.unassign()' in text
          assert 'без WanGP' in text
          print('FREE wolf notebook: OK')
          PY

      - name: Enforce FREE LOCK
        shell: bash
        run: |
          set -euo pipefail
          echo "No Netlify deploy, no paid API, no paid GPU job, and no duplicate Pages deploy is started by this workflow."
          echo "GitHub native Pages pipeline remains the single deployment owner."
