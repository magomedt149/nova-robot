[build]
  publish = "."

# FREE DEPLOY GATE:
# Production deploys run only when .netlify-release changes.
# Normal commits are skipped and consume no production-deploy credits.
[context.production]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- .netlify-release"

# Deploy Previews and branch deploys remain available for free testing.
[context.deploy-preview]
  ignore = "exit 1"

[context.branch-deploy]
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/update.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Versioned static assets may be cached by the browser to reduce repeat bandwidth.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
