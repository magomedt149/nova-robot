<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Обновление NOVA</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020713;color:#eefaff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(480px,100%);text-align:center;padding:28px;border:1px solid #2fc9ee55;border-radius:28px;background:#07152ccc;box-shadow:0 0 50px #19d5ff20}
    .logo{width:76px;height:76px;margin:auto;border-radius:22px;display:grid;place-items:center;font-weight:900;font-size:42px;color:#05111f;background:linear-gradient(145deg,#e5fdff,#40dfff)}
    h1{font-size:25px;margin:18px 0 8px}p{line-height:1.45;color:#b8d8e8}.state{font-weight:800;color:#76f6d4;margin-top:18px}
  </style>
</head>
<body>
<main>
  <div class="logo">N</div>
  <h1>Обновляю NOVA</h1>
  <p>Удаляю только старый кэш приложения. Память, настройки и локальные данные NOVA не трогаю.</p>
  <div id="state" class="state">Подготовка…</div>
</main>
<script>
(async () => {
  const FALLBACK_TARGET = '27.3.1';
  const state = document.getElementById('state');
  let TARGET = FALLBACK_TARGET;

  try {
    const response = await fetch('./version.json?nova_version=' + Date.now(), {
      cache: 'no-store',
      credentials: 'same-origin'
    });
    const info = await response.json();
    if (response.ok && /^\d+\.\d+\.\d+$/.test(String(info?.pwa || info?.version || ''))) {
      TARGET = String(info.pwa || info.version);
    }
  } catch (_) {}
  const set = (text) => { state.textContent = text; };

  try {
    set('Останавливаю старую версию…');
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((reg) => reg.unregister().catch(() => false)));
    }

    set('Очищаю старый кэш NOVA…');
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys
        .filter((key) => /^nova-|^tumsoev-motion-/i.test(key))
        .map((key) => caches.delete(key)));
    }

    set('Загружаю NOVA ' + TARGET + '…');
    const bust = Date.now();
    await fetch('./index.html?nova_update=' + bust, { cache: 'reload', credentials: 'same-origin' });
    await fetch('./app.js?v=' + TARGET + '&nova_update=' + bust, { cache: 'reload', credentials: 'same-origin' });
    await fetch('./service-worker.js?v=' + TARGET + '&nova_update=' + bust, { cache: 'reload', credentials: 'same-origin' });

    try { sessionStorage.setItem('nova.manualUpdate.completed', TARGET); } catch (_) {}
    set('Готово. Открываю новую NOVA…');
    setTimeout(() => {
      location.replace('./?nova_updated=' + encodeURIComponent(TARGET) + '&t=' + Date.now());
    }, 500);
  } catch (error) {
    console.error('[NOVA UPDATE]', error);
    set('Не удалось обновить. Проверь интернет и нажми обновить страницу.');
  }
})();
</script>
</body>
</html>
